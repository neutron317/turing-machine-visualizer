# エンジンの検証を自動化する。
# ローカルと同じコマンド(make ターゲット経由の docker compose)を実行し、
# 開発環境と CI の差をなくす。
#
# 各ステージ(build / test / lint / format)を matrix で独立ジョブに分け、PR の
# チェック一覧でどれが落ちたか一目で分かるようにする(fail-fast: false なので
# 1 つ落ちても他は止めない)。
#
# NOTE: 依存は engine/Dockerfile でイメージ層に焼き、docker/bake の GHA レイヤ
#       キャッシュ(image ごとに scope 分離)で再利用する。キャッシュヒット時は
#       依存を再コンパイルせず高速(初回、または engine/turing-visualizer.cabal
#       変更時のみ遅い)。build/test は engine、lint/format は lint、web-* は web
#       イメージのみをビルドする(web も同様に web/Dockerfile へ依存を焼く)。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build
            target: engine-build
            image: engine
          - name: test
            target: engine-test
            image: engine
          - name: lint
            target: engine-lint
            image: lint
          - name: format
            target: engine-fmt-check
            image: lint
          - name: web-build
            target: web-build
            image: web
          - name: web-typecheck
            target: web-typecheck
            image: web
          - name: web-check
            target: web-check
            image: web
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v3

      - name: イメージをビルド(${{ matrix.image }} / GHA レイヤキャッシュで依存を再利用)
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          targets: ${{ matrix.image }}
          load: true
          set: |
            *.cache-from=type=gha,scope=${{ matrix.image }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.image }}

      - name: ${{ matrix.name }}
        run: make ${{ matrix.target }}
