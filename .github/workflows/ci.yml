# エンジンの検証を自動化する。
# ローカルと同じコマンド(make ターゲット経由の docker compose)を実行し、
# 開発環境と CI の差をなくす。
#
# NOTE: 依存は engine/Dockerfile でイメージ層に焼き、docker/bake の GHA レイヤ
#       キャッシュで再利用する。キャッシュヒット時は依存を再コンパイルせず高速
#       (初回、または engine/turing-visualizer.cabal 変更時のみ遅い)。
#       フロント(JS/TS)の CI はステージ4で追加する。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine (build / test / lint / format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Buildx をセットアップ
        uses: docker/setup-buildx-action@v3

      - name: イメージをビルド(GHA レイヤキャッシュで依存を再利用)
        uses: docker/bake-action@v5
        with:
          files: docker-compose.yml
          load: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: ビルド
        run: make engine-build

      - name: 整形チェック (ormolu)
        run: make engine-fmt-check

      - name: 静的解析 (hlint)
        run: make engine-lint

      - name: テスト
        run: make engine-test
