# 開発環境はすべてコンテナ内で完結させる。
# 単発コマンドは make ターゲット(例: make engine-build)で実行する。
services:
  # ビルド/テスト用: GHC 9.6 + cabal(arm64 ネイティブ)
  engine:
    image: turing-visualizer-engine:dev
    build:
      context: ./engine
    working_dir: /work/engine
    volumes:
      - .:/work # リポジトリをマウント(ソース・fixtures)
      - cabal-store:/root/.cabal # 依存キャッシュ(永続)
      - engine-dist:/work/engine/dist-newstyle # ビルド成果物(永続・ホストFS回避)

  # lint/format 用: hlint + ormolu(最新版)。arm64-linux 配布が無いため
  # x86_64 版を linux/amd64 で emulation 実行。
  lint:
    image: turing-visualizer-lint:dev
    build:
      context: ./tools
      dockerfile: lint.Dockerfile
    platform: linux/amd64
    working_dir: /work/engine
    volumes:
      - .:/work

  # フロント用: Node 22 + pnpm。node_modules は名前付きボリュームで保持し、
  # バインドマウント(.:/work)による空ディレクトリ上書きを避ける。
  web:
    image: turing-visualizer-web:dev
    build:
      context: ./web
    working_dir: /work/web
    volumes:
      - .:/work
      - web-node-modules:/work/web/node_modules

volumes:
  cabal-store:
  engine-dist:
  web-node-modules:
